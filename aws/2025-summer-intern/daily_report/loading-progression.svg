<svg width="800" height="300" xmlns="http://www.w3.org/2000/svg" style="background-color: white;">
  <!-- Title -->
  <text x="400" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold">Loading Progression Series</text>
  
  <!-- State 1: 33% -->
  <g transform="translate(50, 80)">
    <text x="0" y="-10" font-family="Arial, sans-serif" font-size="14">State 1: Starting (33%)</text>
    <!-- Background bar -->
    <rect x="0" y="0" width="200" height="30" rx="15" fill="#e0e0e0"/>
    <!-- Progress bar -->
    <rect x="0" y="0" width="66" height="30" rx="15" fill="#4CAF50"/>
    <!-- Animated stripes -->
    <defs>
      <pattern id="stripes1" patternUnits="userSpaceOnUse" width="20" height="30">
        <rect x="0" y="0" width="10" height="30" fill="#5CBF60" opacity="0.5"/>
      </pattern>
    </defs>
    <rect x="0" y="0" width="66" height="30" rx="15" fill="url(#stripes1)"/>
    <text x="100" y="20" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="white">Progressing...</text>
  </g>
  
  <!-- State 2: 66% -->
  <g transform="translate(300, 80)">
    <text x="0" y="-10" font-family="Arial, sans-serif" font-size="14">State 2: Progress (66%)</text>
    <!-- Background bar -->
    <rect x="0" y="0" width="200" height="30" rx="15" fill="#e0e0e0"/>
    <!-- Progress bar -->
    <rect x="0" y="0" width="132" height="30" rx="15" fill="#4CAF50"/>
    <!-- Animated stripes -->
    <defs>
      <pattern id="stripes2" patternUnits="userSpaceOnUse" width="20" height="30">
        <rect x="0" y="0" width="10" height="30" fill="#5CBF60" opacity="0.5"/>
      </pattern>
    </defs>
    <rect x="0" y="0" width="132" height="30" rx="15" fill="url(#stripes2)"/>
    <text x="100" y="20" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="white">Progressing...</text>
  </g>
  
  <!-- State 3: 100% -->
  <g transform="translate(550, 80)">
    <text x="0" y="-10" font-family="Arial, sans-serif" font-size="14">State 3: Complete (100%)</text>
    <!-- Background bar -->
    <rect x="0" y="0" width="200" height="30" rx="15" fill="#e0e0e0"/>
    <!-- Progress bar -->
    <rect x="0" y="0" width="200" height="30" rx="15" fill="#4CAF50"/>
    <text x="100" y="20" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="white">Complete!</text>
  </g>
  
  <!-- Alternative dot style -->
  <g transform="translate(50, 180)">
    <text x="0" y="-10" font-family="Arial, sans-serif" font-size="14">Alternative Style - State 1</text>
    <circle cx="10" cy="10" r="8" fill="#4CAF50"/>
    <circle cx="30" cy="10" r="8" fill="#4CAF50"/>
    <circle cx="50" cy="10" r="8" fill="#e0e0e0"/>
    <circle cx="70" cy="10" r="8" fill="#e0e0e0"/>
    <circle cx="90" cy="10" r="8" fill="#e0e0e0"/>
    <circle cx="110" cy="10" r="8" fill="#e0e0e0"/>
  </g>
  
  <g transform="translate(300, 180)">
    <text x="0" y="-10" font-family="Arial, sans-serif" font-size="14">Alternative Style - State 2</text>
    <circle cx="10" cy="10" r="8" fill="#4CAF50"/>
    <circle cx="30" cy="10" r="8" fill="#4CAF50"/>
    <circle cx="50" cy="10" r="8" fill="#4CAF50"/>
    <circle cx="70" cy="10" r="8" fill="#4CAF50"/>
    <circle cx="90" cy="10" r="8" fill="#e0e0e0"/>
    <circle cx="110" cy="10" r="8" fill="#e0e0e0"/>
  </g>
  
  <g transform="translate(550, 180)">
    <text x="0" y="-10" font-family="Arial, sans-serif" font-size="14">Alternative Style - State 3</text>
    <circle cx="10" cy="10" r="8" fill="#4CAF50"/>
    <circle cx="30" cy="10" r="8" fill="#4CAF50"/>
    <circle cx="50" cy="10" r="8" fill="#4CAF50"/>
    <circle cx="70" cy="10" r="8" fill="#4CAF50"/>
    <circle cx="90" cy="10" r="8" fill="#4CAF50"/>
    <circle cx="110" cy="10" r="8" fill="#4CAF50"/>
  </g>
  
  <!-- Block style -->
  <g transform="translate(50, 250)">
    <text x="0" y="-10" font-family="Arial, sans-serif" font-size="14">Block Style - 33%</text>
    <rect x="0" y="0" width="30" height="20" fill="#4CAF50" rx="2"/>
    <rect x="35" y="0" width="30" height="20" fill="#4CAF50" rx="2"/>
    <rect x="70" y="0" width="30" height="20" fill="#e0e0e0" rx="2"/>
    <rect x="105" y="0" width="30" height="20" fill="#e0e0e0" rx="2"/>
    <rect x="140" y="0" width="30" height="20" fill="#e0e0e0" rx="2"/>
    <rect x="175" y="0" width="30" height="20" fill="#e0e0e0" rx="2"/>
  </g>
  
  <g transform="translate(300, 250)">
    <text x="0" y="-10" font-family="Arial, sans-serif" font-size="14">Block Style - 66%</text>
    <rect x="0" y="0" width="30" height="20" fill="#4CAF50" rx="2"/>
    <rect x="35" y="0" width="30" height="20" fill="#4CAF50" rx="2"/>
    <rect x="70" y="0" width="30" height="20" fill="#4CAF50" rx="2"/>
    <rect x="105" y="0" width="30" height="20" fill="#4CAF50" rx="2"/>
    <rect x="140" y="0" width="30" height="20" fill="#e0e0e0" rx="2"/>
    <rect x="175" y="0" width="30" height="20" fill="#e0e0e0" rx="2"/>
  </g>
  
  <g transform="translate(550, 250)">
    <text x="0" y="-10" font-family="Arial, sans-serif" font-size="14">Block Style - 100%</text>
    <rect x="0" y="0" width="30" height="20" fill="#4CAF50" rx="2"/>
    <rect x="35" y="0" width="30" height="20" fill="#4CAF50" rx="2"/>
    <rect x="70" y="0" width="30" height="20" fill="#4CAF50" rx="2"/>
    <rect x="105" y="0" width="30" height="20" fill="#4CAF50" rx="2"/>
    <rect x="140" y="0" width="30" height="20" fill="#4CAF50" rx="2"/>
    <rect x="175" y="0" width="30" height="20" fill="#4CAF50" rx="2"/>
  </g>
</svg>